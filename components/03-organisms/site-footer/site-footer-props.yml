# site-footer-props.yml
#
# Site Footer component property definitions.
# This file is the single source of truth for both Storybook controls
# and MDX documentation tables.

borderThickness:
  twigProp: site_footer__border_thickness
  name: Border Thickness
  type: select
  required: false
  description: Top border thickness for the site footer. Fixed in Drupal.
  default: '8'
  fixed: true

siteFooterTheme:
  twigProp: site_footer__theme
  name: Footer Theme (dial)
  type: select
  required: false
  description: Color theme applied to the site footer
  detail: >
    Controls the overall footer color scheme. Options are derived from the
    site-footer-themes design tokens.
  default: one
  control: select
  labels:
    one: 'Base & White'
    two: 'Action & Dark Gray'
    three: 'Highlight & Yale Blue'

siteFooterAccent:
  twigProp: site_footer__accent
  name: Footer Accent Color (dial)
  type: select
  required: false
  description: Accent color applied to links and interactive elements in the footer
  default: one
  options:
    - one
    - two
    - three
    - four
    - five
    - six
    - seven
    - eight
  control: select
  labels:
    one: 'One'
    two: 'Two'
    three: 'Three'
    four: 'Four'
    five: 'Five'
    six: 'Six'
    seven: 'Seven'
    eight: 'Eight'

siteFooterVariation:
  twigProp: site_footer__variation
  name: Footer Variation (dial)
  type: select
  required: false
  description: Layout variation for the site footer
  default: basic
  options:
    - basic
    - mega
  control: select
  labels:
    basic: 'Basic'
    mega: 'Mega'

cookieSettings:
  twigProp: site_footer__cookie_settings
  name: Cookie Settings Link
  type: boolean
  required: false
  description: Show a "Cookie Settings" link next to the privacy policy link
  detail: >
    Turn on only when the site asks visitors for cookie consent. The link has
    rel="open-consent-manager", which the consent library uses to open its
    preferences dialog.
  default: false
  control: boolean
