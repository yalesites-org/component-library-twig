# layout-props.yml
#
# Layout component property definitions.
# This file is the single source of truth for both Storybook controls
# and MDX documentation tables.

divider:
  twigProp: layout__divider
  name: Divider
  type: boolean
  required: false
  description: Show a visual divider between layout regions
  detail: >
    When true, displays a visual divider between layout content regions. Passed
    to Twig as the string 'true' or 'false' via layout__divider, and mirrored
    onto the section root as data-component-has-divider. Has no effect on
    'one-column' -- a single region has nothing to divide. 'seventy-thirty'
    honours it like the other multi-column layouts, but draws its separator as
    a border on .yds-layout__secondary gated on that data attribute, rather
    than as a .yds-layout__divider element: rendering both for one section drew
    the line twice.
  default: false
  control: boolean

layoutOption:
  twigProp: component__layout
  name: Layout
  type: select
  required: false
  description: Column configuration for the layout
  detail: >
    Selects the section layout. This is the only thing that differs between the
    four YaleSites Layout Builder sections -- all of them render through this
    one component, which emits the shared signature
    `<div class="yds-layout layout" data-component-theme data-component-layout>`.
    Adding a new section type (a 30/70, say) means adding a value here and its
    flex-basis rules in _yds-layout.scss, not a new template. 'one-column' is a
    single region, so it renders its content directly in the section element
    rather than inside the __inner flex row and a __primary column.
  default: fifty-fifty
  options:
    - one-column
    - fifty-fifty
    - thirty-thirty-thirty
    - seventy-thirty
  control: select

layoutPadding:
  twigProp: layout__padding
  name: Padding
  type: select
  required: false
  description: Vertical padding configuration for the layout component
  default: default
  options:
    Default (current padding): default
    No top padding: no-top
    No bottom padding: no-bottom
    No padding (top and bottom): no-padding
  control: select

theme:
  twigProp: component__theme
  name: Component Theme
  type: select
  required: false
  description: Color theme applied to the layout component
  default: default
  options:
    - default
    - one
    - two
    - three
    - four
    - five
    - six
  control: select
