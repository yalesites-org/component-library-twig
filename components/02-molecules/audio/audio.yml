audio_embed__transcript: '<p>[Upbeat swing band intro with trumpet and piano.]</p><p><strong>Vocalist:</strong> A sung invitation to take the highway west, naming the towns along the route from Chicago to Los Angeles.</p><p>[Trumpet solo, then the band plays the closing chorus.]</p>'
