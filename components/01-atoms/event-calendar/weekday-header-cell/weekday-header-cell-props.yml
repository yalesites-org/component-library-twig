# weekday-header-cell-props.yml
#
# Weekday header cell atom property definitions: single source for Storybook controls and docs.
# Text and label carry content; alignment picks the Full month (start) or Mini calendar (center) look.

text:
  twigProp: weekday_header_cell__text
  name: Text
  type: string
  required: false
  description: The short weekday shown.
  default: Mon

label:
  twigProp: weekday_header_cell__label
  name: Accessible label
  type: string
  required: false
  description: Full weekday for screen readers. Rendered as hidden text; the visible text is hidden from assistive tech.
  default: Monday

alignment:
  twigProp: weekday_header_cell__alignment
  name: Alignment
  type: select
  required: false
  description: start for the Full month grid, center for the Mini calendar.
  default: start
  options:
    - start
    - center
  control: select
