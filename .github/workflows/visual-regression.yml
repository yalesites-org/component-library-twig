name: Visual Regression
on:
  pull_request:
    types: [ready_for_review]
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Check whether components were changed.
        # Then below, we can only run steps if there's something to test.
      - uses: dorny/paths-filter@v3
        id: component_changes
        with:
          filters: |
            components:
              - 'components/**'
      - name: Install Node.js
        if: steps.component_changes.outputs.components == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Restored before install so Puppeteer's postinstall finds a browser
      # already there instead of pulling ~150MB on every run.
      - name: Cache Puppeteer browsers
        if: steps.component_changes.outputs.components == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.component_changes.outputs.components == 'true'
        run: npm ci
        env:
          YALESITES_BUILD_TOKEN: ${{ secrets.YALESITES_BUILD_TOKEN }}
      - name: Build storybook
        if: steps.component_changes.outputs.components == 'true'
        run: npm run storybook:build
      # Puppeteer's postinstall normally fetches this, but newer npm gates
      # install scripts, so ask for it explicitly. It is a no-op once cached.
      - name: Install Chrome
        if: steps.component_changes.outputs.components == 'true'
        run: npx puppeteer browsers install chrome
      # Runs before Percy so an uncapturable snapshot fails the job cheaply.
      - name: Check visreg pixel ceiling
        if: steps.component_changes.outputs.components == 'true'
        run: npm run visreg:measure
      - name: Run Percy Tests
        if: steps.component_changes.outputs.components == 'true'
        run: npm run visreg:ci
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
